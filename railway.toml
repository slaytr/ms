# Railway web service (SPA + /api/*) in the shared "runescape" project, next to iron's `web`.
# DATABASE_URL references the project's existing Postgres. Migrations run at server boot and only
# create ms_-prefixed objects. Railpack runs `npm run build` itself and starts via the `start` script.
[build]
builder = "RAILPACK"

[deploy]
startCommand = "node api/server.mjs"
healthcheckPath = "/healthz"
restartPolicyType = "ON_FAILURE"
