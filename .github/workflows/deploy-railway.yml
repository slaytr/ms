name: Deploy to Railway

# Deploys the maplestory app (the SPA + /api/*, Railway service "maplestory frontend", in the shared "runescape"
# project next to iron's services) on
# every push to main, plus on demand via workflow_dispatch. The service is addressed by ID, not name, so
# renaming it in Railway can't break the deploy (service IDs are not secrets). Database migrations aren't a step here:
# api/server.mjs runs them itself at boot (runMigrations()), so each deploy carries its own migrations.
#
# Needs one GitHub repository secret, RAILWAY_TOKEN: a Railway *project token* for the production
# environment (Railway > project > Settings > Tokens). Railway's own GitHub auto-deploy must stay off
# (service Settings > Source), or every push would deploy twice.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Fixture-based suites are skipped: their screenshots are gitignored, so CI has none (see ci.yml).
      - run: >-
          npx vitest run
          --exclude "**/detect/detect.test.ts"
          --exclude "**/detect/inventory.test.ts"
          --exclude "**/detect/view.test.ts"
          --exclude "**/detect/quickslots.test.ts"
          --exclude "**/level-infer.fixtures.test.ts"

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy maplestory frontend
        run: railway up --service ad378f4d-e127-46bd-84db-1dabca842a44 --ci
